name: aira
description: "AIRA — a cross-platform Flutter AI assistant for OpenJarvis, powered by Hermes Agent and OmniRoute."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  flutter_markdown: ^0.7.6
  record: ^5.1.0
  just_audio: ^0.10.4
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
