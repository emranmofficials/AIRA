name: Build AIRA APK

on:
  push:
    branches: [main]
    paths:
      - "aira/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner if missing
        working-directory: aira
        run: |
          if [ ! -d android ]; then
            flutter create --project-name aira --org com.openjarvis \
              --platforms=android .
          fi

      - name: Install dependencies
        working-directory: aira
        run: flutter pub get

      - name: Run unit tests
        working-directory: aira
        run: flutter test

      - name: Build APK
        working-directory: aira
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aira-release-apk
          path: aira/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
