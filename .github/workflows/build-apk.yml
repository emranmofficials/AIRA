name: Build AIRA APK

on:
  push:
    branches: [main]
    paths:
      - "aira/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner if missing
        working-directory: aira
        run: |
          if [ ! -d android ]; then
            flutter create --project-name aira --org com.openjarvis \
              --platforms=android .
            # Flutter's default counter test does not belong to this app.
            rm -f test/widget_test.dart
          fi

      - name: Install dependencies
        working-directory: aira
        run: flutter pub get

      - name: Run unit tests
        working-directory: aira
        run: flutter test

      - name: Build APK
        working-directory: aira
        run: flutter build apk --release

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=aira/build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK"
          gh release view aira-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create aira-latest --repo "$GITHUB_REPOSITORY" \
              --title "AIRA latest" --generate-notes
          gh release upload aira-latest "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          echo "APK published: https://github.com/$GITHUB_REPOSITORY/releases/tag/aira-latest"
